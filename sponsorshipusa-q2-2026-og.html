<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1200, initial-scale=1" />
<title>صورة مشاركة — رعاية سلسلة مكالمات نتائج الشركات الأمريكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: #08172d; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(780px 500px at 7% 100%, rgba(29, 90, 158, .42), transparent 68%),
      radial-gradient(650px 420px at 95% -10%, rgba(214, 177, 91, .18), transparent 64%),
      linear-gradient(135deg, #0b1d38, #071327 68%, #050e1d);
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: .46;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.12) 1px, transparent 0);
    background-size: 18px 18px;
  }
  .brand {
    position: absolute;
    z-index: 3;
    top: 46px;
    right: 66px;
    width: 360px;
    height: 84px;
    overflow: hidden;
  }
  .brand img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .flag {
    position: absolute;
    z-index: 3;
    top: 56px;
    left: 70px;
    width: 80px;
    height: 52px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 14px 30px rgba(0,0,0,.28);
  }
  .content {
    position: absolute;
    z-index: 3;
    inset: 154px 68px 54px;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    gap: 12px;
    color: #e1bd67;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    letter-spacing: .06em;
    direction: rtl;
  }
  .eyebrow::before { content: ''; width: 38px; height: 2px; background: #d6b15b; }
  h1 {
    max-width: 930px;
    margin-top: 20px;
    color: #fff;
    font-size: 68px;
    line-height: 1.14;
    letter-spacing: -.025em;
    font-weight: 700;
  }
  h1 span { color: #e1bd67; }
  .description {
    max-width: 900px;
    margin-top: 18px;
    color: #d7e0ee;
    font-size: 27px;
    line-height: 1.55;
    font-weight: 500;
  }
  .chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    padding: 10px 18px 12px;
    border: 1px solid rgba(214,177,91,.38);
    border-radius: 999px;
    color: #f4e4b9;
    background: rgba(255,255,255,.06);
    font-size: 19px;
    font-weight: 600;
  }
  .chart { position: absolute; z-index: 1; inset: 0; opacity: .48; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .accent {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    width: 10px;
    height: 100%;
    background: linear-gradient(180deg, #d6b15b, #1d5a9e);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="accent"></div>
    <div class="chart" aria-hidden="true">
      <svg viewBox="0 0 1200 630" preserveAspectRatio="none">
        <defs>
          <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1d5a9e" stop-opacity="0" />
            <stop offset=".55" stop-color="#6b8fb5" stop-opacity=".42" />
            <stop offset="1" stop-color="#d6b15b" stop-opacity=".78" />
          </linearGradient>
        </defs>
        <path d="M-40 530 L105 510 L210 545 L340 465 L475 490 L610 390 L735 430 L880 320 L1010 355 L1240 210" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M-40 530 L105 510 L210 545 L340 465 L475 490 L610 390 L735 430 L880 320 L1010 355 L1240 210 L1240 650 L-40 650 Z" fill="url(#line)" opacity=".08" />
      </svg>
    </div>
    <div class="brand"><img src="assets/alsagri-logo-horizontal-dark.png" alt="الصقري | Alsagri Capital" /></div>
    <img class="flag" src="assets/sponsorship/us-flag.png" alt="" />
    <div class="content">
      <div class="eyebrow">شراكة حصرية · 3 أشهر</div>
      <h1>رعاية سلسلة مكالمات<br><span>نتائج الشركات الأمريكية</span></h1>
      <p class="description">كن الشريك الحصري لتغطية عربية متخصصة أمام جمهور استثماري سعودي.</p>
      <div class="chips">
        <span class="chip">أكثر من 35 تغطية</span>
        <span class="chip">جمهور مالي متخصص</span>
        <span class="chip">حتى 15 سبتمبر 2026</span>
      </div>
    </div>
  </div>
</body>
</html>
