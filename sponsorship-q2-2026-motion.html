  <!-- Motion page only: count-up animation for the KPI numbers. Vanilla JS so it
       stays self-contained to this page and never touches the shared component. -->
  <script>
  (function () {
    if (document.body.dataset.page !== 'sponsorship-motion') return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    function parse(txt) {
      var m = txt.match(/^(\D*)(\d[\d,]*(?:\.\d+)?)(.*)$/);
      if (!m) return null;
      var digits = m[2].replace(/,/g, '');
      var dec = digits.indexOf('.') > -1 ? digits.split('.')[1].length : 0;
      return { prefix: m[1], target: parseFloat(digits), suffix: m[3], dec: dec, raw: txt };
    }

    function run(el) {
      var info = parse(el.textContent.trim());
      if (!info) return;
      var dur = 1600, start = null;
      function frame(ts) {
        if (start === null) start = ts;
        var t = Math.min(1, (ts - start) / dur);
        var e = 1 - Math.pow(1 - t, 3); // easeOutCubic
        var cur = info.target * e;
        el.textContent = info.prefix + cur.toFixed(info.dec) + info.suffix;
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          el.textContent = info.raw;
          el.classList.add('spm-pop');
        }
      }
      requestAnimationFrame(frame);
    }

    function init() {
      var els = document.querySelectorAll('.sp-stat-value strong');
      if (!els.length) return false;
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { io.unobserve(en.target); run(en.target); }
        });
      }, { threshold: 0.6 });
      els.forEach(function (el) { io.observe(el); });
      return true;
    }

    var tries = 0;
    var iv = setInterval(function () {
      if (init() || ++tries > 50) clearInterval(iv);
    }, 100);
  })();
  </script>
